      - "&7Raison : &6%reason%"
      - "&7Statut : &b%status%"
      - "&7Serveur : &a%server%"
      - "&7Date : &f%date%"
      - "&8ID du Signalement : %uuid%"
      - ""
      - "&7[!] Clic-droit pour ouvrir les détails"
      - "&7[!] Clic-gauche pour vous l'assigner"
      - "&7[!] Shift-clic pour fermer le ticket"
    
    detail:
      title: "&d&lDétails du Signalement &7- &e#%id%"
      reporter: "&bSignaleur : &f%player%"
      target: "&cCible : &f%player%"
      info-title: "&bInformations du Signalement"
      info-reason: "&7Raison : &f%reason%"
      info-server: "&7Serveur : &a%server%"
      info-status: "&7Statut : &e%status%"
      info-date: "&7Date : &f%date%"
      status-prefix: "&7Statut : "
      title-prefix: "&dSignalement : &e#"
      teleport: "&dTéléporter à la Position"
      teleport-lore: [ "&7Cliquez pour vous téléporter", "&7où le signalement a été créé." ]

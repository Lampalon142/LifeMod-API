## LifeMod - Configuration du Langage
## Langue : Français (French)

# --- SYSTEM MESSAGES ---
system:
  prefix: "&7[&6Moderation&7] &f» "
  no-permission: "%prefix%&cVous n'avez pas la permission pour cela."
  player-only: "%prefix%&cCette commande ne peut être exécutée que par un joueur."
  player-not-found: "%prefix%&cCe joueur n'est pas connecté au serveur."
  config-reloaded: "%prefix%&aConfiguration rechargée avec succès !"
  date-format: "dd/MM/yyyy HH:mm:ss" # Optional override
  update:
    enabled: true
    failed: "&c[LifeMod] Échec de la récupération de la dernière version."
    up-to-date: "&a[LifeMod] LifeMod est à jour."
    unreleased: "&e[LifeMod] Vous utilisez une version non encore publiée."
    error: "&c[LifeMod] Impossible de vérifier les mises à jour."
    message: |
      &dBonjour %player%
      &bUne mise à jour de LifeMod est disponible !
      &eVotre version : &c%current_version%
      &eNouvelle version : &a%latest_version%
      &eLien : &bhttps://bit.ly/lifemod-update
      &r
      &e===========================

# --- SANCTIONS ---
sanctions:
  # Command logic
  cmd:
    usage: "&cUtilisation : /%cmd% <joueur> [raison] <temps> [-s]"
    usage-no-time: "&cUtilisation : /%cmd% <joueur> [raison] [-s]"
    default-reason: "Aucune raison spécifiée"
    revoke-usage: "&cUtilisation : /%cmd% <joueur> [raison] [-s]"
    revoke-success: "&aLa sanction (%type%) pour &e%player% &aa été révoquée."
    revoke-silent: "&7[SILENCIEUX] &aLa sanction (%type%) pour &e%player% &aa été révoquée."
    revoke-not-found: "&cCe joueur n'a aucune sanction active de type %type%."

  # Specific Sanctions
  ban:
    success: "&aLe joueur &e%player% &aa été banni pour : &f%reason%"
    received: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cVous avez été banni !
      &7Raison : &f%reason%
      &7Banni par : &e%issuer%
      &7Temps restant : &f%time%
      &8&m----------------------------------------
    login: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cVous êtes banni de ce serveur !
      &7Raison : &f%reason%
      &7Expire le : &e%expiration%
      &7ID de Sanction : &8#%id%
      &8&m----------------------------------------
    kick-message: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cVous avez été banni !
      &7Raison : &f%reason%
      &8&m----------------------------------------

  mute:
    success: "&aLe joueur &e%player% &aa été rendu muet pour : &f%reason%"
    received: "&cVous avez été rendu muet ! Raison : &f%reason%"
    title: "&d&lMUET"
    subtitle: "&7%reason%"
    blocked: |
      &cVous êtes muet !
      &7Raison : &f%reason%
      &7Expire dans : &f%time%
    chat-blocked: |
      &cVous êtes réduit au silence !
      &7Raison : &f%reason%
      &7Expire le : &e%expiration%

  kick:
    success: "&aLe joueur &e%player% &aa été expulsé pour : &f%reason%"
    message: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cVous avez été expulsé !
      &7Raison : &f%reason%
      &7Par : &e%issuer%
      &8&m----------------------------------------

  warn:
    success: "&aAvertissement envoyé à &e%player% pour : &f%reason%"
    received: "&c&lAVERTISSEMENT ! &7Raison : &f%reason%"
    title: "&c&lAVERTISSEMENT"
    subtitle: "&7%reason%"

  note:
    success: "&aNote ajoutée pour &e%player% : &f%reason%"

  # Broadcasts (Local & Network)
  broadcast:
    ban:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &aa été &c&lBANNI &apar &e%issuer%&a.\n&7Raison : &f%reason%\n&7Durée : &f%time%\n&8&m----------------------------------------"
      silent: "&7[SILENCIEUX] &c%issuer% &7a banni &c%target% &7(%time%) pour : &f%reason%"
    mute:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &aa été &d&lRENDU MUET &apar &e%issuer%&a.\n&7Raison : &f%reason%\n&7Durée : &f%time%\n&8&m----------------------------------------"
      silent: "&7[SILENCIEUX] &c%issuer% &7a rendu muet &c%target% &7(%time%) pour : &f%reason%"
    kick:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &aa été &c&lEXPULSÉ &apar &e%issuer%&a.\n&7Raison : &f%reason%\n&8&m----------------------------------------"
      silent: "&7[SILENCIEUX] &c%issuer% &7a expulsé &c%target% &7pour : &f%reason%"
    warn:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &aa été &e&lAVARTI &apar &e%issuer%&a.\n&7Raison : &f%reason%\n&8&m----------------------------------------"
      silent: "&7[SILENCIEUX] &c%issuer% &7a averti &c%target% &7pour : &f%reason%"
    unban:
      public: "&a%target% a été débanni par %issuer%. Raison : %reason%"
      silent: "&7[SILENCIEUX] &a%target% a été débanni par %issuer%. Raison : %reason%"
    unmute:
      public: "&a%target% n'est plus muet grâce à %issuer%. Raison : %reason%"
      silent: "&7[SILENCIEUX] &a%target% n'est plus muet grâce à %issuer%. Raison : %reason%"


      close-lore: [ "&7Cliquez pour résoudre et", "&7fermer ce signalement." ]
      back: "&7« Retour"
      teleport-success: "&aTéléporté à la position du signalement."

    notes:
      title: "&6Notes : &e#%id%"
      add: "&a✚ Ajouter une note"
      prompt: "&aTapez votre note dans le chat (ou 'cancel' pour annuler)"
      item-title: "&eNote par &f%author%"
      item-date: "&7Date : &f%date%"
      item-edit: "&eClic-gauche pour éditer"
      item-delete: "&cClic-droit pour supprimer"
      delete-success: "&aNote supprimée !"
      chat-cancelled: "&eAction de note annulée."
      chat-saved: "&aNote sauvegardée avec succès !"
      errors:
        empty: "&cVotre note ne peut pas être vide."
      menu:
        edit:
          cancelled: "&eÉdition annulée."
          saved: "&aNote mise à jour !"
        chat:
          cancelled: "&eCréation de note annulée."
          saved: "&aNote ajoutée !"


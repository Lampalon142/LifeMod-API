## LifeMod - Language Configuration
## Default Language: English (Native)

# --- SYSTEM MESSAGES ---
system:
  prefix: "&7[&6Moderation&7] &f» "
  no-permission: "%prefix%&cYou don't have permission for this."
  player-only: "%prefix%&cThis command can only be executed by a player."
  player-not-found: "%prefix%&cThis player is not connected to the server."
  config-reloaded: "%prefix%&aConfiguration reloaded successfully!"
  date-format: "dd/MM/yyyy HH:mm:ss" # Optional override
  update:
    enabled: true
    failed: "&c[LifeMod] Failed to retrieve the latest version."
    up-to-date: "&a[LifeMod] LifeMod is up to date."
    unreleased: "&e[LifeMod] You are using a version not yet released."
    error: "&c[LifeMod] Unable to check for updates."
    message: |
      &dHello %player%
      &bLifeMod has an available update!
      &eYour version: &c%current_version%
      &eNew version: &a%latest_version%
      &eLink: &bhttps://bit.ly/lifemod-update
      &r
      &e===========================

# --- SANCTIONS ---
sanctions:
  # Command logic
  cmd:
    usage: "&cUsage: /%cmd% <player> [reason] <time> [-s]"
    usage-no-time: "&cUsage: /%cmd% <player> [reason] [-s]"
    default-reason: "No reason specified"
    revoke-usage: "&cUsage: /%cmd% <player> [reason] [-s]"
    revoke-success: "&aThe sanction (%type%) for &e%player% &ahas been revoked."
    revoke-silent: "&7[SILENT] &aThe sanction (%type%) for &e%player% &ahas been revoked."
    revoke-not-found: "&cThis player has no active sanction of type %type%."

  # Specific Sanctions
  ban:
    success: "&aPlayer &e%player% &ahas been banned for: &f%reason%"
    received: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cYou have been banned!
      &7Reason: &f%reason%
      &7Banned by: &e%issuer%
      &7Time remaining: &f%time%
      &8&m----------------------------------------
    login: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cYou are banned from this server!
      &7Reason: &f%reason%
      &7Expires on: &e%expiration%
      &7Sanction ID: &8#%id%
      &8&m----------------------------------------
    kick-message: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cYou have been banned!
      &7Reason: &f%reason%
      &8&m----------------------------------------

  mute:
    success: "&aPlayer &e%player% &ahas been muted for: &f%reason%"
    received: "&cYou have been muted! Reason: &f%reason%"
    title: "&d&lMUTED"
    subtitle: "&7%reason%"
    blocked: |
      &cYou are muted!
      &7Reason: &f%reason%
      &7Expires in: &f%time%
    chat-blocked: |
      &cYou are reduced to silence!
      &7Reason: &f%reason%
      &7Expires on: &e%expiration%

  kick:
    success: "&aPlayer &e%player% &ahas been kicked for: &f%reason%"
    message: |
      &8&m----------------------------------------
      &6&lLifeMod
      &cYou have been kicked!
      &7Reason: &f%reason%
      &7By: &e%issuer%
      &8&m----------------------------------------

  warn:
    success: "&aWarning sent to &e%player% for: &f%reason%"
    received: "&c&lWARNING! &7Reason: &f%reason%"
    title: "&c&lWARNING"
    subtitle: "&7%reason%"

  # Broadcasts (Local & Network)
  broadcast:
    ban:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &ahas been &c&lBANNED &aby &e%issuer%&a.\n&7Reason: &f%reason%\n&7Duration: &f%time%\n&8&m----------------------------------------"
      silent: "&7[SILENT] &c%issuer% &7banned &c%target% &7(%time%) for: &f%reason%"
    mute:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &ahas been &d&lMUTED &aby &e%issuer%&a.\n&7Reason: &f%reason%\n&7Duration: &f%time%\n&8&m----------------------------------------"
      silent: "&7[SILENT] &c%issuer% &7muted &c%target% &7(%time%) for: &f%reason%"
    kick:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &ahas been &c&lKICKED &aby &e%issuer%&a.\n&7Reason: &f%reason%\n&8&m----------------------------------------"
      silent: "&7[SILENT] &c%issuer% &7kicked &c%target% &7for: &f%reason%"
    warn:
      public: "&8&m----------------------------------------\n&6&lLifeMod &8» &e%target% &ahas been &e&lWARNED &aby &e%issuer%&a.\n&7Reason: &f%reason%\n&8&m----------------------------------------"
      silent: "&7[SILENT] &c%issuer% &7warned &c%target% &7for: &f%reason%"
    unban:
      public: "&a%target% has been unbanned by %issuer%. Reason: %reason%"
      silent: "&7[SILENT] &a%target% has been unbanned by %issuer%. Reason: %reason%"
    unmute:
      public: "&a%target% has been unmuted by %issuer%. Reason: %reason%"
      silent: "&7[SILENT] &a%target% has been unmuted by %issuer%. Reason: %reason%"

# --- REPORTS ---

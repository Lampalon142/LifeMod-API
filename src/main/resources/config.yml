# --- SERVER SETTINGS ---
server:
  name: "Survival"
  # Format for dates in GUI and messages
  date-format: "dd/MM/yyyy HH:mm:ss"
  # Global prefix for all messages
  prefix: "&7[&6Moderation&7] &f» "

# --- DATABASE ---
database:
  type: "sqlite" # 'sqlite' or 'mysql'
  host: "localhost"
  port: 3306
  name: "lifemod"
  user: "root"
  password: ""
  poolsize: 10
  sqlite-file: "database.db"

# --- REDIS (Network Sync) ---
redis:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""

# --- MODULES ---
modules:
  # Hybrid Auto-Punish System
  auto-punish:
    enabled: true
    mode: "CATEGORY" # 'GLOBAL' or 'CATEGORY'
    global:
      thresholds:
        3: "kick %player% &cAuto-Punish: 3 active warnings."
        5: "ban %player% 7d &cAuto-Punish: 5 active warnings."
    categories:
      Cheat:
        1: "ban %player% 7d &cAuto-Punish: Cheat (1st warning)"
        2: "ban %player% permanent &cAuto-Punish: Cheat (Recidivism)"
      Chat:
        1: "mute %player% 30m &cAuto-Punish: Chat Behavior (1st warning)"
        2: "mute %player% 2h &cAuto-Punish: Chat Behavior (2nd warning)"
        3: "mute %player% 24h &cAuto-Punish: Chat Behavior (Recidivism)"

  # Chat Security & Management
  chat-manager:
    enabled: true
    notification: "&c%player% attempted to send a forbidden word!"
    blacklist:
      - "fuck"
      - "bitch"
      - "suck"

  # Moderator Security System
  moderator-auth:
    enabled: false
    max-attempts: 5
    session-timeout-minutes: 30
    require-ip-match: false

  # Moderation Mode (Inventory & Tools)
  mod-mode:
    items:
      navigation:
        enabled: true
        slot: 0
        material: COMPASS
        custom-model-data: 1001
        name: "&6&lNavigation"
        lore:
          - "&7--------------------------"
          - "&eLeft-Click &8» &fThru"
          - "&eRight-Click &8» &fJump"
          - "&7--------------------------"
        actions:
          LEFT_CLICK:
            - "[NATIVE] THRU"
            - "[SOUND] ENTITY_EXPERIENCE_ORB_PICKUP"
          RIGHT_CLICK:
            - "[NATIVE] JUMP"
            - "[SOUND] ENTITY_ENDERMAN_TELEPORT"
            - "[MESSAGE] &8&l» &7Teleportation Success."
      inspector:
        enabled: true
        slot: 1
        material: BOOK
        name: "&bInspector"
        lore:
          - "&7Right-Click Player: &eInvSee"
          - "&7Right-Click Block: &eSilent Open"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] INSPECT_INVENTORY"
            - "[SOUND] BLOCK_CHEST_OPEN"
      freeze:
        enabled: true
        slot: 2
        material: PACKED_ICE
        name: "&bFreeze Tool"
        lore:
          - "&7Right-Click: &eFreeze/Unfreeze"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] FREEZE"
      randomtp:
        enabled: true
        slot: 3
        material: ENDER_PEARL
        name: "&bRandom TP"
        lore:
          - "&7Right-Click: &eTeleport"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] RANDOM_TP"
      vanish:
        enabled: true
        slot: 8
        material: GRAY_DYE
        name: "&aVanish Toggle"
        lore:
          - "&7Right-Click: &eToggle Vanish"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] VANISH"
      cpstester:
        enabled: true
        slot: 4
        material: CLOCK
        duration: 10
        name: "&eCPS Tester"
        lore:
          - "&7Right-Click Player: &eCheck CPS"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] CPS_TESTER"
      kbtester:
        enabled: true
        slot: 5
        material: STICK
        name: "&cKnockback Tester"
        lore:
          - "&7Attack: &eTest KB"
        enchantments:
          KNOCKBACK: 2
        actions:
          LEFT_CLICK:
            - "[NATIVE] KNOCKBACK_TESTER"
          RIGHT_CLICK:
            - "[NATIVE] KNOCKBACK_TESTER"
      infoviewer:
        enabled: true
        slot: 6
        material: BLAZE_ROD
        name: "&6Information Viewer"
        lore:
          - "&7Right-Click Player: &eView Details"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] INFO_VIEWER"

  # Anti-Alt Heuristic Engine
  antialt:
    enabled: true
    debug: false # Logs analysis score for every joining player
    
    # --- Heuristic Weights (0-100) ---
    weights:
      entropy: 40
      bigram: 25
      trigram: 35
      casing: 15
      suffix: 50
      ip-history: 50 # Bonus penalty if IP is already flagged

    # --- Thresholds & Reactions ---
    entropy-threshold: 3.8
    
    # Reaction thresholds (score is 0-100)
    thresholds:
      30: # Suspect
        - "[LOG] Player %player% is suspect (Score: %score%, Reason: %reason%)"
        - "[STAFF] &c[AntiAlt] &e%player% &cest suspect (Score: %score%, Raison: %reason%)."
      60: # Critical
        - "[STAFF] &c[AntiAlt] &4&lCRITICAL&c: &e%player% &cest un alt très probable (Score: %score%)."
        - "[CONSOLE] mute %player% 1h Alt suspect (Automated)"
      85: # High-Threat Alt
        - "[CONSOLE] ban %player% 30d High-Threat Alt (Score: %score%, Reason: %reason%)"
        - "[DISCORD] Player `%player%` was auto-banned (Score: %score%, Reason: %reason%)"
        
    whitelist:
      - "PlayerToIgnore"

  # Discord Webhook Integration
  discord:
    enabled: false
    webhook-url: "INSERT_YOUR_WEBHOOK_HERE"
    alerts:
      mod:
        title: "Moderation Mode"
        description: "> %player% has toggled moderation mode!"
        color: "#FF0000"
      report:
        title: "New Report"
        description: "> %player% has reported someone!"
        color: "#FF0000"
      ban:
        title: "New Ban"
        description: "> %player% has been banned by %issuer% for: %reason%"
        color: "#FF0000"
      hearts:
        title: "Health Change"
        description: "> %player% changed %target%'s hearts by %amount% (%action%)"
        color: "#FF0000"
      # generic for others
      generic:
        title: "Staff Alert"
        description: "> %player% executed command: %message%"
        color: "#FF0000"
      footer:
        text: "Powered By LifeMod"
        logo: "https://mc-heads.net/avatar/%player%/"

# --- COMMANDS STATUS ---
commands:
  enabled:
    ban: true
    kick: true
    mute: true
    warn: true
    history: true
    case: true
    report: true
    reports: true
    staffchat: true
    vanish: true
    freeze: true
    fly: true
    gamemode: true
    invsee: true
    oinvsee: true
    otp: true
    speed: true
    spectate: true
    hearts: true
    difficulty: true
    settime: true
    weather: true
    modlogin: true
    modregister: true
    modchangepass: true
    modreset: true

# Metadata
version: 200

# --- SERVER SETTINGS ---
server:
  name: "Survival"
  # Format for dates in GUI and messages
  date-format: "dd/MM/yyyy HH:mm:ss"
  # Global prefix for all messages
  prefix: "&7[&6Moderation&7] &f» "

# --- DATABASE ---
database:
  type: "sqlite" # 'sqlite' or 'mysql'
  host: "localhost"
  port: 3306
  name: "lifemod"
  user: "root"
  password: ""
  poolsize: 10
  sqlite-file: "database.db"

# --- REDIS (Network Sync) ---
redis:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""

# --- MODULES ---
modules:
  # Hybrid Auto-Punish System
  auto-punish:
    enabled: true
    mode: "CATEGORY" # 'GLOBAL' or 'CATEGORY'
    global:
      thresholds:
        3: "kick %player% &cAuto-Punish: 3 active warnings."
        5: "ban %player% 7d &cAuto-Punish: 5 active warnings."
    categories:
      Cheat:
        1: "ban %player% 7d &cAuto-Punish: Cheat (1st warning)"
        2: "ban %player% permanent &cAuto-Punish: Cheat (Recidivism)"
      Chat:
        1: "mute %player% 30m &cAuto-Punish: Chat Behavior (1st warning)"
        2: "mute %player% 2h &cAuto-Punish: Chat Behavior (2nd warning)"
        3: "mute %player% 24h &cAuto-Punish: Chat Behavior (Recidivism)"

  # Chat Security & Management
  chat-manager:
    enabled: true
    notification: "&c%player% attempted to send a forbidden word!"
    blacklist:
      - "fuck"
      - "bitch"
      - "suck"

  # Moderator Security System
  moderator-auth:
    enabled: false
    max-attempts: 5
    session-timeout-minutes: 30
    require-ip-match: false

  # Moderation Mode (Inventory & Tools)
  mod-mode:
    items:
      invSee:
        enabled: true
        material: "PAPER"
        slot: 0
        name: "&bInventory Viewer"
        description: "&7Right-click a player to view their inventory."
      freeze:
        enabled: true
        material: "PACKED_ICE"
        slot: 1
        name: "&bFreeze Player"
        description: "&7Right-click a player to freeze or unfreeze them."
      tpRandom:
        enabled: true
        material: "ENDER_PEARL"
        slot: 2
        name: "&bRandom Teleport"
        description: "&7Right-click to teleport to a random player."
      vanish:
        enabled: true
        material: "BLAZE_POWDER"
        slot: 3
        name: "&bVanish"
        description: "&7Right-click to toggle vanish mode."
      killItem:
        enabled: true
        material: "BLAZE_ROD"
        slot: 4
        name: "&cKill Player"
        description: "&7Right-click a player to instantly kill them."
      kbTester:
        enabled: true
        material: "STICK"
        slot: 5
        name: "&eKnockback Tester"
        description: "&7Test knockback on players."
        enchantments:
          KNOCKBACK: 5
      cps-tester:
        enabled: true
        material: "COMPASS"
        slot: 7
        duration: 3
        cooldown: 10
        name: "&bCPS Tester"
        description: "&7Click a player to test their CPS!"

  # Discord Webhook Integration
  discord:
    enabled: false
    webhook-url: "INSERT_YOUR_WEBHOOK_HERE"
    alerts:
      mod:
        title: "Moderation Mode"
        description: "> %player% has toggled moderation mode!"
        color: "#FF0000"
      report:
        title: "New Report"
        description: "> %player% has reported someone!"
        color: "#FF0000"
      ban:
        title: "New Ban"
        description: "> %player% has been banned by %issuer% for: %reason%"
        color: "#FF0000"
      hearts:
        title: "Health Change"
        description: "> %player% changed %target%'s hearts by %amount% (%action%)"
        color: "#FF0000"
      # generic for others
      generic:
        title: "Staff Alert"
        description: "> %player% executed command: %message%"
        color: "#FF0000"
      footer:
        text: "Powered By LifeMod"
        logo: "https://mc-heads.net/avatar/%player%/"

# --- COMMANDS STATUS ---
commands:
  enabled:
    ban: true
    kick: true
    mute: true
    warn: true
    history: true
    case: true
    report: true
    reports: true
    staffchat: true
    vanish: true
    freeze: true
    fly: true
    gamemode: true
    invsee: true
    oinvsee: true
    otp: true
    speed: true
    spectate: true
    hearts: true
    difficulty: true
    settime: true
    weather: true
    modlogin: true
    modregister: true
    modchangepass: true
    modreset: true

# Metadata
version: 200

name: LifeMod
authors: [Lampalon]
version: '2.0.0-SNAPSHOT'
main: fr.lampalon.lifemod.platform.bukkit.LifeMod
api-version: '1.13'
softdepend:
  - LuckPerms
commands:
  mod:
    description: Moderate your server
    aliases: ["staff"]
  broadcast:
    aliases: ["bc"]
    description: Produces a message for the entire server.
  gm:
    aliases: ["gamemode"]
    description: Changes the game mode.
  fly:
    description: Allows you to fly.
  ecopen:
    description: Open a person's ec
  vanish:
    aliases: ["v"]
    description: Vanish you or other player.
  clearinv:
    description: Clear inventory for a player or yourself.
  stafflist:
    description: View moderators online.
  staffchat:
    description: chatting with other staffs.
  chatclear:
    description: To clear the chat.
  togglechat:
    description: To activate or not the chat.
  heal:
    description: To heal a player or yourself.
  tp:
    description: To tp to a person.
  tphere:
    description: Tp person to you.
  weather:
    description: To change the time.
  god:
    description: To activate or deactivate god for invincibility.
  freeze:
    description: To freeze and unfreeze player.
  invsee:
    description: To see inventory of a player.
  feed:
    description: To feed you or other player.
  lifemod:
    description: use Lifemod for help or reload.
  speed:
    description: permit you to update your speed.
  spectate:
    description: See player from a command.
  otp:
    description: teleport to an offline player.
  oinvsee:
    description: See the inventory of a offline player.
  hearts:
    description: "Manage player hearts: set or add a specific amount of hearts to any player."
  settime:
    description: Quickly set the world time to day, night, noon, or midnight.
  difficulty:
    description: Change the server difficulty to peaceful, easy, normal, or hard.
  report:
    description: Report a player
  reports:
    description: see all reports
  modlogin:
    description: Authenticate as a moderator.
    usage: /modlogin <password>
    permission: lifemod.moderator
  modregister:
    description: Register your moderator password.
    usage: /modregister <password>
    permission: lifemod.moderator
  modchangepass:
    description: Change your moderator password.
    usage: /modchangepass <old> <new>
    permission: lifemod.moderator
  modreset:
    description: Reset a moderator's password (admin only).
    usage: /modreset <player>
    permission: lifemod.admin
  follow:
    description: follow a player with somes informations.
    usage: /<command>
  ban:
    description: Ban a player from the server.
    usage: /ban <player> <reason> [duration] [-s]
  kick:
    description: Kick a player from the server.
    usage: /kick <player> <reason> [-s]
  mute:
    description: Mute a player in the chat.
    usage: /mute <player> <reason> [duration] [-s]
  warn:
    description: Warn a player.
    usage: /warn <player> <reason> [-s]
  note:
    description: Add a private staff note to a player.
    usage: /note <player> <content>
  unban:
    description: Unban a player.
    usage: /unban <player> [reason]
  unmute:
    description: Unmute a player.
    usage: /unmute <player> [reason]
  history:
    description: View a player's sanction history.
    usage: /history <player>
  case:
    description: View a player's moderation case.
    usage: /case <player>
  alts:
    description: View a player's alternative accounts.
    usage: /alts <player/ip>
  alt:
    description: Analyze a player for suspicious patterns.
    usage: /alt <player>
  staffhistory:
    description: View a moderator's sanction history.
    usage: /staffhistory <player>
    permission: lifemod.admin.staffhistory
permissions:
  lifemod.*:
    default: op
    children:
      - lifemod.fly
      - lifemod.fly.others
      - lifemod.gm
      - lifemod.mod
      - lifemod.bc
      - lifemod.ecopen
      - lifemod.vanish
      - lifemod.clearinv
      - lifemod.staffchat
      - lifemod.heal
      - lifemod.tp
      - lifemod.tphere
      - lifemod.weather
      - lifemod.god
      - lifemod.freeze
      - lifemod.invsee
      - lifemod.feed
      - lifemod.chat.views
      - lifemod.chat.bypass
      - lifemod.invsee.interact
      - lifemod.notify
      - lifemod.spectate
      - lifemod.otp
      - lifemod.oinvsee
      - lifemod.time
      - lifemod.difficulty
      - lifemod.hearts
      - lifemod.togglechat.bypass
      - lifemod.togglechat
      - lifemod.staff
      - lifemod.reports
      - lifemod.stafflist
      - lifemod.report.join
      - lifemod.moderator
      - lifemod.admin
      - lifemod.ban
      - lifemod.kick
      - lifemod.mute
      - lifemod.warn
      - lifemod.note
      - lifemod.unban
      - lifemod.unmute
      - lifemod.history
      - lifemod.case
      - lifemod.alts
      - lifemod.antialt.check
      - lifemod.antialt.notify

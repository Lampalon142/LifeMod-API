## LifeMod Proxy Language
## Multi-Server Synchronization

# --- SYSTEM ---
system:
  prefix: "&7[&6Network&7] &f» "

# --- SANCTIONS ---
sanctions:
  # Network broadcasts
  broadcast:
    ban:
      public: "&8&m----------------------------------------\n&6&lNetwork &8» &e%target% &ahas been &c&lBANNED &aby &e%issuer%&a.\n&7Reason: &f%reason%\n&7Server: &e%server%\n&8&m----------------------------------------"
      silent: "&7[SILENT-NETWORK] &c%issuer% &7banned &c%target% &7from &e%server%"
    unban: "&6&lNetwork &8» &a%target% has been unbanned by %issuer%."

  ban:
    kick-message: |
      &8&m----------------------------------------
      &6&lLifeMod Network
      &cYou are banned from the entire network!
      &7Reason: &f%reason%
      &7By: &e%issuer%
      &8&m----------------------------------------

  mute:
    blocked-message: "&cYou are muted on the network!\n&7Reason: &f%reason%\n&7Expires in: &f%time%"

# Metadata
version: 200
## LifeMod - Main Configuration
## Created and Directed by Lampalon_
## Discord: https://discord.gg/VndbGNgZ5R

# --- SERVER SETTINGS ---
server:
  name: "Survival"
  # Language file to use (located in languages/ folder, e.g., en_US, fr_FR)
  language: "en_US"
  # Format for dates in GUI and messages
  date-format: "dd/MM/yyyy HH:mm:ss"

# --- DATABASE ---
database:
  type: "sqlite" # 'sqlite' or 'mysql'
  host: "localhost"
  port: 3306
  name: "lifemod"
  user: "root"
  password: ""
  poolsize: 10
  sqlite-file: "database.db"

# --- REDIS (Network Sync) ---
redis:
  enabled: false
  host: "localhost"
  port: 6379
  password: ""

# --- MODULES ---
modules:
  # Hybrid Auto-Punish System
  auto-punish:
    enabled: true
    mode: "CATEGORY" # 'GLOBAL' or 'CATEGORY'
    global:
      thresholds:
        3: "kick %player% &cAuto-Punish: 3 active warnings."
        5: "ban %player% 7d &cAuto-Punish: 5 active warnings."
    categories:
      Cheat:
        1: "ban %player% 7d &cAuto-Punish: Cheat (1st warning)"
        2: "ban %player% permanent &cAuto-Punish: Cheat (Recidivism)"
      Chat:
        1: "mute %player% 30m &cAuto-Punish: Chat Behavior (1st warning)"
        2: "mute %player% 2h &cAuto-Punish: Chat Behavior (2nd warning)"
        3: "mute %player% 24h &cAuto-Punish: Chat Behavior (Recidivism)"

  # Chat Security & Management
  chat-manager:
    enabled: true
    notification: "&c%player% attempted to send a forbidden word!"
    blacklist:
      - "fuck"
      - "bitch"
      - "suck"

  # Moderator Security System
  moderator-auth:
    enabled: false
    max-attempts: 5
    session-timeout-minutes: 30
    require-ip-match: false

  # Staff Chat (Cross-Server)
  staffchat:
    enabled: true
    prefix: "!"

  # Moderation Mode (Inventory & Tools)
  mod-mode:
    effects:
      game-mode: "SURVIVAL"
      allow-flight: true
      flying: true
      invulnerable: true
      night-vision: true
    vanish:
      collidable: false
      can-pickup-items: false
      invisibility: true
    items:
      navigation:
        enabled: true
        slot: 0
        material: COMPASS
        custom-model-data: 1001
        jump-max-distance: 100
        thru-max-depth: 10
        name: "&6&lNavigation"
        lore:
          - "&7--------------------------"
          - "&eLeft-Click &8» &fThru"
          - "&eRight-Click &8» &fJump"
          - "&7--------------------------"
        actions:
          LEFT_CLICK:
            - "[NATIVE] THRU"
            - "[SOUND] ENTITY_EXPERIENCE_ORB_PICKUP"
          RIGHT_CLICK:
            - "[NATIVE] JUMP"
            - "[SOUND] ENTITY_ENDERMAN_TELEPORT"
            - "[MESSAGE] &8&l» &7Teleportation Success."
      inspector:
        enabled: true
        slot: 1
        material: BOOK
        name: "&bInspector"
        lore:
          - "&7Right-Click Player: &eInvSee"
          - "&7Right-Click Block: &eSilent Open"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] INSPECT_INVENTORY"
            - "[SOUND] BLOCK_CHEST_OPEN"
      freeze:
        enabled: true
        slot: 2
        material: PACKED_ICE
        helmet-material: PACKED_ICE
        name: "&bFreeze Tool"
        lore:
          - "&7Right-Click: &eFreeze/Unfreeze"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] FREEZE"
      randomtp:
        enabled: true
        slot: 3
        material: ENDER_PEARL
        name: "&bRandom TP"
        lore:
          - "&7Right-Click: &eTeleport"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] RANDOM_TP"
      vanish:
        enabled: true
        slot: 8
        material: GRAY_DYE
        name: "&aVanish Toggle"
        lore:
          - "&7Right-Click: &eToggle Vanish"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] VANISH"
      cpstester:
        enabled: true
        slot: 4
        material: CLOCK
        duration: 10
        autoclicker-threshold: 15.0
        name: "&eCPS Tester"
        lore:
          - "&7Right-Click Player: &eCheck CPS"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] CPS_TESTER"
      kbtester:
        enabled: true
        slot: 5
        material: STICK
        knockback-multiplier: 0.5
        knockback-y: 0.4
        name: "&cKnockback Tester"
        lore:
          - "&7Attack: &eTest KB"
        enchantments:
          KNOCKBACK: 2
        actions:
          LEFT_CLICK:
            - "[NATIVE] KNOCKBACK_TESTER"
          RIGHT_CLICK:
            - "[NATIVE] KNOCKBACK_TESTER"
      infoviewer:
        enabled: true
        slot: 6
        material: BLAZE_ROD
        name: "&6Information Viewer"
        lore:
          - "&7Right-Click Player: &eView Details"
        actions:
          RIGHT_CLICK:
            - "[NATIVE] INFO_VIEWER"

  # Anti-Alt Heuristic Engine
  antialt:
    enabled: true
    debug: false

    # Seuils de décision
    thresholds:
      log-silent: 30
      alert-admin: 50
      alert-priority: 70
      suggest-ban: 85

    # Poids des signaux
    weights:
      ip-exact-banned: 60
      ip-temporal-24h: 30
      ip-temporal-week: 15
      ip-subnet: 25
      vpn-alone: 15
      vpn-multiplier: 1.4
      vpn-score-threshold: 30
      pseudo-entropy: 20
      pseudo-bigram: 15
      pseudo-suffix: 15
      pseudo-casing: 10
      pseudo-troll: 25
      ip-history-multiple: 20
      sudden-vpn-switch: 20
      sudden-vpn-days: 30

    # Protection NAT automatique
    nat-detection:
      enabled: true
      legitimate-threshold: 3

    # Analyse pseudo
    entropy-threshold: 3.8

    # Mots troll universels — entièrement configurables
    troll-patterns:
      - "hack"
      - "cheat"
      - "grief"
      - "ban"
      - "admin"
      - "owner"
      - "op"
      - "instaban"
      - "troll"
      - "bypass"

    # Regex de détection — entièrement configurables
    regex-patterns:
      generated-suffix: "[_-][a-zA-Z0-9]{4,8}$"
      numeric-suffix: "[a-zA-Z]{3,}[0-9]{2,4}$"
      char-repetition: "(.)\\1{3,}"

    # Fenêtres temporelles
    temporal:
      recent-ban-hours: 24
      medium-ban-days: 7

    # Whitelist
    whitelist:
      ips: []
      uuids: []
      subnets: []

  # AntiVPN & Network Security
  antivpn:
    enabled: false
    block-vpn: true
    geo-blocking:
      mode: "NONE" # NONE, WHITELIST, BLACKLIST
      countries:
        - "FR"
        - "BE"
        - "CA"
    blocked-isps:
      - "OVH"
      - "Hetzner"
      - "DigitalOcean"
      - "Cloudflare"
      - "Hostinger"
    whitelist:
      - "127.0.0.1"
      - "Lampalon"
    anti-bot:
      global-limit: 5 # max connections per second
      per-ip-cooldown: 10000 # ms (10 seconds)

  # Discord Webhook Integration
  discord:
    enabled: false
    webhook-url: "INSERT_YOUR_WEBHOOK_HERE"
    alerts:
      mod:
        title: "Moderation Mode"
        description: "> %player% has toggled moderation mode!"
        color: "#FF0000"
      report:
        title: "New Report"
        description: "> %player% has reported someone!"
        color: "#FF0000"
      ban:
        title: "New Ban"
        description: "> %player% has been banned by %issuer% for: %reason%"
        color: "#FF0000"
      hearts:
        title: "Health Change"
        description: "> %player% changed %target%'s hearts by %amount% (%action%)"
        color: "#FF0000"
      # generic for others
      generic:
        title: "Staff Alert"
        description: "> %player% executed command: %message%"
        color: "#FF0000"
      footer:
        text: "Powered By LifeMod"
        logo: "https://mc-heads.net/avatar/%player%/"

  # PostHog Analytics
  posthog:
    enabled: true

  # Replay System
  replay:
    recording-tick-rate: 2
    observer-distance: 5.0
    observer-y-offset: 2.0
    observer-yaw-offset: 180.0
    observer-pitch: 15.0
    playback-speed: 1.0
    spawn-delay-ticks: 20
    ticks-per-frame: 1
    progress-interval: 200
    game-mode: "CREATIVE"
    allow-flight: true
    items:
      rewind:
        slot: 0
        material: ARROW
      forward:
        slot: 1
        material: ARROW
      pause:
        slot: 4
        material: CLOCK
      exit:
        slot: 8
        material: BARRIER
    gui:
      inventory:
        timeline-material: GRAY_STAINED_GLASS_PANE
        play-pause:
          slot: 40
          material: LIME_DYE
        speed:
          slot: 38
          material: FEATHER
        pov-switch:
          slot: 42
          material: ARROW
        exit:
          slot: 49
          material: BARRIER
      controls:
        stop-material: RED_WOOL
        pause-material: YELLOW_WOOL
        play-material: GREEN_WOOL
        speed-material: LIME_WOOL

  # Map & Inventory Scan System
  scan:
    # Max locations stored in memory (0 = unlimited)
    max-locations: 5000
    # Max locations shown in chat report
    max-report-locations: 10
    # Timeout in seconds before scan auto-cancels (0 = no timeout)
    timeout-seconds: 120
    # Scan unloaded chunks via region files (.mca)
    region-file-scan: true
    # Max region files to process per world (0 = unlimited)
    max-region-files: 0
    # Use strict item matching (compare full NBT/components when available)
    strict-item-matching: true

# --- COMMANDS STATUS ---
commands:
  enabled:
    ban: true
    kick: true
    mute: true
    warn: true
    history: true
    case: true
    report: true
    reports: true
    staffchat: true
    vanish: true
    freeze: true
    fly: true
    gamemode: true
    invsee: true
    oinvsee: true
    otp: true
    speed: true
    spectate: true
    hearts: true
    difficulty: true
    settime: true
    weather: true
    modlogin: true
    modregister: true
    modchangepass: true
    modreset: true
    auth: true

# --- GUI MATERIALS ---
gui:
  border-material: BLACK_STAINED_GLASS_PANE
  pagination:
    previous-material: ARROW
    next-material: ARROW
  sanctions:
    materials:
      BAN: RED_CONCRETE
      MUTE: ORANGE_CONCRETE
      WARN: YELLOW_CONCRETE
      KICK: GRAY_CONCRETE
      default: PAPER
  reports:
    item-material: PAPER
    detail:
      reporter-material: PLAYER_HEAD
      target-material: PLAYER_HEAD
      info-material: BOOK
      teleport-material: COMPASS
      assign-material: LIME_DYE
      close-material: RED_DYE
      back-material: ARROW
  alts:
    materials:
      banned: RED_TERRACOTTA
      online: LIME_TERRACOTTA
      offline: GRAY_TERRACOTTA
  notes:
    add-material: WRITABLE_BOOK
    item-material: PAPER
  staffhistory:
    filter-type-material: HOPPER
    filter-player-material: PLAYER_HEAD
    filter-date-material: CLOCK
    time-filter-options:
      - label: "1h"
        millis: 3600000
      - label: "24h"
        millis: 86400000
      - label: "1 week"
        millis: 604800000

# --- AUTH GUI ---
auth:
  gui:
    materials:
      border: BLACK_STAINED_GLASS_PANE
      progress: PAPER
      digit: LIGHT_GRAY_STAINED_GLASS_PANE
      delete: ORANGE_STAINED_GLASS_PANE
      clear: RED_STAINED_GLASS_PANE
      validate: LIME_STAINED_GLASS_PANE
    slots:
      digit-1: 19
      digit-2: 20
      digit-3: 21
      digit-4: 28
      digit-5: 29
      digit-6: 30
      digit-7: 37
      digit-8: 38
      digit-9: 39
      digit-0: 47
      delete: 25
      clear: 43
      validate: 52

# --- DEBUG ---
debug:
  enabled: false
  log-level: "INFO"
  modules:
    staff: false
    freeze: false
    vanish: false
    mod: false
    chat: false

# Metadata
version: 201

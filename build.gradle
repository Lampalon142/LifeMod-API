plugins {
    id 'com.gradleup.shadow' version '8.3.3'
    id "com.modrinth.minotaur" version "2.8.7" apply false
}

group = 'fr.lampalon.lifemod'
// x-release-please-start-version
version = '1.4.0'
// x-release-please-end

allprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
        maven { url 'https://repo.xenondevs.xyz/releases' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url 'https://repo.codemc.io/repository/maven-public/' }
        maven { url 'https://jitpack.io' }
    }
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}

dependencies {
    implementation project(':common')
    implementation project(':platform:bukkit')
    implementation project(':platform:bungee')
}

shadowJar {
    archiveClassifier.set('')
    destinationDirectory.set(layout.projectDirectory.dir('out'))
    archiveBaseName.set('LifeMod')

    relocate 'com.github.retrooper.packetevents', 'fr.lampalon.lifemod.libs.packetevents'
    relocate 'xyz.xenondevs.invui', 'fr.lampalon.lifemod.libs.invui'
    relocate 'xyz.xenondevs.inventoryaccess', 'fr.lampalon.lifemod.libs.inventoryaccess'
    relocate 'redis.clients.jedis', 'fr.lampalon.lifemod.libs.jedis'
    relocate 'com.zaxxer.hikari', 'fr.lampalon.lifemod.libs.hikari'
    relocate 'org.bstats', 'fr.lampalon.lifemod.libs.bstats'
    relocate 'okhttp3', 'fr.lampalon.lifemod.libs.okhttp3'
    relocate 'okio', 'fr.lampalon.lifemod.libs.okio'
    relocate 'kotlin', 'fr.lampalon.lifemod.libs.kotlin'

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

}

task createApiJar(type: Copy) {
    dependsOn ':api:jar'
    from project(':api').tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('out')
    rename { 'LifeMod-API.jar' }
}

task deployDevServers {
    doLast {
        def jarName = shadowJar.archiveFileName.get()
        def jarFile = shadowJar.destinationDirectory.get().asFile.toPath().resolve(jarName).toFile()

        // Clean old JARs from out/
        delete fileTree(shadowJar.destinationDirectory.get().asFile).matching {
            include "LifeMod*.jar"
            exclude "LifeMod-API.jar"
            exclude jarName
        }

        def targets = [
            'C:/Users/Lampalon/Desktop/serveurs/Lobby/plugins',
            'C:/Users/Lampalon/Desktop/serveurs/Proxy/plugins',
            'C:/Users/Lampalon/Desktop/serveurs/Skyblock/plugins',
            'C:/Users/Lampalon/Desktop/serveurs/1.21.11/plugins'
        ]
        targets.each { dir ->
            def targetDir = file(dir)
            // Delete old LifeMod JARs in target
            delete fileTree(targetDir).matching { include "LifeMod*.jar" }
            // Copy new JAR
            copy {
                from jarFile
                into targetDir
            }
            println "Deployed LifeMod to ${dir}"
        }
    }
}

shadowJar.finalizedBy deployDevServers
deployDevServers.dependsOn createApiJar

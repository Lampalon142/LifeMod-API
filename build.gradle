plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'fr.lampalon'
            artifactId = 'lifemod-api'
            version = rootProject.version

            from components.java

            pom {
                name = 'LifeMod API'
                description = 'Public API for LifeMod Minecraft plugin'
                url = 'https://github.com/Lampalon142/LifeMod'
            }
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Lampalon142/LifeMod'
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.token') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

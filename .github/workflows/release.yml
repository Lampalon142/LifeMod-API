name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - run: chmod +x gradlew

      - name: Build shadowJar
        run: ./gradlew shadowJar

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh

          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.sha }}"^ 2>/dev/null || git rev-list --max-parents=0 HEAD)

          ./scripts/generate-changelog.sh "$PREV_TAG" "${{ github.sha }}" > /tmp/changelog.md

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/LifeMod-*.jar
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        run: ./gradlew modrinth -PmodrinthToken=${{ secrets.MODRINTH_TOKEN }}

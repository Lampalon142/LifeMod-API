name: Release

on:
  push:
    branches: [v2]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.0.0")
          VER="${PREV_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          NEW_PATCH=$((PATCH + 1))
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$MAJOR.$MINOR.$NEW_PATCH" >> "$GITHUB_OUTPUT"

      - name: Update version in build.gradle
        run: |
          sed -i "s/version = '.*'/version = '${{ steps.version.outputs.version }}'/" build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - run: chmod +x gradlew

      - name: Build shadowJar
        run: ./gradlew shadowJar

      - name: Commit & tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:v2
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          ./scripts/generate-changelog.sh "${{ steps.version.outputs.prev_tag }}" "v${{ steps.version.outputs.version }}" > /tmp/changelog.md
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: out/LifeMod-*.jar
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Modrinth
        run: ./gradlew modrinth -PmodrinthToken=${{ secrets.MODRINTH_TOKEN }}
